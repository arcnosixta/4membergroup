<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создание таблицы</title>
  <style>
  /* Ашық режимнің түстері. */
  :root {
    color-scheme: light;
    --page-bg: #f3f4f6;
    --text: #27303e;
    --surface: #ffffff;
    --soft-bg: #e7eaf0;
    --muted: #525d70;
    --border: #737e90;
  }

  /* Қараңғы режимнің түстері. */
  body.dark-mode {
    color-scheme: dark;
    --page-bg: #0f1014;
    --text: #eef0f4;
    --surface: #171922;
    --soft-bg: #232634;
    --muted: #b5bdcc;
    --border: #8792a5;
  }

    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    a { color: var(--text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: var(--muted); }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-end;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 12px #00000008;
    }
    label { display: flex; flex-direction: column; gap: 6px; }
    input, select {
      width: 100px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    select { width: auto; }
    input:focus, select:focus { outline: 2px solid #b31515; outline-offset: 2px; }
    button {
      padding: 12px 20px;
      background: #b31515;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #901111; }
    #message { margin-top: 24px; }
    .table-container { overflow-x: auto; margin-top: 20px; }
    table { border-collapse: collapse; background: var(--surface); }
    td { border: 1px solid var(--border); min-width: 50px; height: 50px; }

  .theme-toggle {
    margin-top: 12px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  .theme-toggle:hover { background: var(--soft-bg); }
  button:focus-visible, a:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }
  input, select, textarea {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  </style>
  <script src="theme.js" defer></script>
</head>
<body>
  <a href="index.html">← На главную</a>
  <button id="theme-toggle" class="theme-toggle" type="button">🌙 Қараңғы режим</button>
  <h1>Создание таблицы</h1>
  <p>Введите количество строк и столбцов от 1 до 30.</p>

  <form id="table-form">
    <label for="rows">Строки
      <input id="rows" type="number" min="1" max="30" step="1" value="3" required>
    </label>
    <label for="columns">Столбцы
      <input id="columns" type="number" min="1" max="30" step="1" value="4" required>
    </label>
    <button type="submit">Создать таблицу</button>
  </form>

  <p id="message" aria-live="polite">Таблица появится после нажатия кнопки.</p>
  <div class="table-container">
    <table id="table" aria-label="Созданная таблица"></table>
  </div>

  <p>Нажимайте на ячейку, чтобы менять её цвет: красный, зелёный, синий, жёлтый.</p>
  <label for="count-color">Цвет для подсчёта</label>
  <select id="count-color">
    <option value="red">Красный</option>
    <option value="green">Зелёный</option>
    <option value="blue">Синий</option>
    <option value="yellow">Жёлтый</option>
  </select>
  <button id="count-button" type="button">Подсчитать</button>
  <p id="count-result" aria-live="polite">Выберите цвет и нажмите «Подсчитать».</p>

  <script>
    // Функция заполняет таблицу указанным количеством строк и столбцов.
    function createTable(rows, columns) {
      const table = document.getElementById("table");
      table.innerHTML = ""; // Удаляем предыдущие строки.
      document.getElementById("count-result").textContent =
        "Выберите цвет и нажмите «Подсчитать».";

      for (let i = 0; i < rows; i++) {
        const row = table.insertRow(); // Создаём строку.

        for (let j = 0; j < columns; j++) {
          row.insertCell(); // Добавляем ячейку в эту строку.
        }
      }

      document.getElementById("message").textContent =
        "Создана таблица: " + rows + " × " + columns;
    }

    // Браузер проверяет ограничения полей перед отправкой формы.
    document.getElementById("table-form").addEventListener("submit", function (event) {
      event.preventDefault(); // Не даём странице перезагрузиться.
      const rows = Number(document.getElementById("rows").value);
      const columns = Number(document.getElementById("columns").value);
      createTable(rows, columns);
    });
  </script>
  <script src="sites/cell-colors.js"></script>
  <script src="color-count.js"></script>
</body>
</html>
