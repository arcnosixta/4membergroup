<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORMA — люди</title>
  <link rel="stylesheet" href="crud/styles.css">
  <link rel="stylesheet" href="users/styles.css">
  <script type="module" src="users/app.js"></script>
</head>
<body>
  <header class="site-header"><a class="logo" href="users.html">FORMA<span> / people</span></a><nav><a href="crud.html">Товары</a> · <a href="index.html">Команда ↗</a></nav></header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">КАТАЛОГ ЛЮДЕЙ</p><h1>Люди и их истории.</h1><p class="muted">Выберите человека, чтобы узнать о нём больше.</p></div><button id="add-person" disabled title="Добавление реализует Нурда">＋ Добавить человека</button></div>
    <section class="toolbar" aria-label="Поиск и фильтры">
      <label class="search" for="search">Имя или ник<input id="search" type="search" placeholder="Например, Emily или emilys"></label>
      <label for="role">Статус (роль)<select id="role"><option value="">Все статусы</option><option value="user">Пользователь</option><option value="moderator">Модератор</option><option value="admin">Админ</option></select></label>
      <label for="sort">Сортировка<select id="sort"><option value="name-asc">Имя: А → Я</option><option value="name-desc">Имя: Я → А</option><option value="default">По умолчанию</option></select></label>
    </section>
    <div class="list-heading"><h2>Все люди</h2><span id="count" class="muted" aria-live="polite"></span></div>
    <p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>Повторить загрузку</button>
    <p id="empty" class="empty" hidden></p><ul id="people" aria-label="Люди"></ul>
    <noscript>Включите JavaScript для просмотра каталога.</noscript>
  </main>
  <footer>Учебный каталог DummyJSON. Статус обозначает роль, а не присутствие онлайн. Изменения действуют до перезагрузки.</footer>
  <dialog id="person-dialog" aria-labelledby="person-title"><button class="close" data-close="person-dialog" aria-label="Закрыть профиль" autofocus>×</button><div id="person-content" class="person-details"></div></dialog>
  <dialog id="create-dialog" class="editor" aria-labelledby="create-heading"><button class="close" data-close="create-dialog" aria-label="Закрыть добавление">×</button><h2 id="create-heading">Добавить человека</h2><div id="create-container"></div><p class="dialog-status" role="status"></p></dialog>
  <dialog id="edit-dialog" class="editor" aria-labelledby="edit-heading"><button class="close" data-close="edit-dialog" aria-label="Закрыть редактирование">×</button><h2 id="edit-heading">Редактировать профиль</h2><div id="edit-container"></div><p class="dialog-status" role="status"></p></dialog>
</body>
</html>
